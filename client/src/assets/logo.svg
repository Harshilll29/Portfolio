<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for left side -->
    <linearGradient id="leftGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29B6F6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for middle -->
    <linearGradient id="middleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for right side -->
    <linearGradient id="rightGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background circle for shadow -->
  <circle cx="60" cy="60" r="45" fill="#f8f9fa" filter="url(#shadow)" opacity="0.3"/>
  
  <!-- Left part of H -->
  <path d="M 25 25 L 25 95 L 40 95 L 40 65 L 55 65 L 55 50 L 40 50 L 40 25 Z" fill="url(#leftGradient)"/>
  
  <!-- Middle connecting bar -->
  <path d="M 40 50 L 80 50 L 80 65 L 55 65 L 55 50 Z" fill="url(#middleGradient)"/>
  
  <!-- Right part of H -->
  <path d="M 80 25 L 80 50 L 95 50 L 95 65 L 80 65 L 80 95 L 95 95 L 95 25 Z" fill="url(#rightGradient)"/>
  
  <!-- Additional depth elements -->
  <path d="M 55 50 L 55 65 L 65 65 L 65 60 L 60 60 L 60 50 Z" fill="url(#middleGradient)" opacity="0.7"/>
</svg>